[project]
name = "sci-data-logger"
version = "0.1.0"
description = "Intelligent materials experiment record processing framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "openai>=1.90.0",
    "Pillow>=10.0.0",
    "pydantic>=2.8.0",
    "pypdfium2>=4.30",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "rich>=13.8.0",
    "sqlmodel>=0.0.22",
    "tenacity>=8.2",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
sci-data-logger = "sci_data_logger.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sci_data_logger"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/sci_data_logger"]
branch = false
omit = [
    # Typer CLI entry point is exercised end-to-end via `sci-data-logger`, not
    # unit-tested. Listed here so coverage targets remain meaningful — drop
    # this when CLI tests land.
    "src/sci_data_logger/cli.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
