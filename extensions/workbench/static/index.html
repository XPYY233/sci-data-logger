<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>湿实验个性化工作台</title>
    <link rel="stylesheet" href="/workbench/assets/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="rail">
        <div>
          <p class="eyebrow">Sci Data Logger</p>
          <h1>个性化工作台</h1>
          <p class="muted">先让系统知道你是谁，再开始整理今天的实验记录。</p>
        </div>

        <nav>
          <button data-view="home" class="active">开始</button>
          <button data-view="record">新建记录</button>
          <button data-view="rules">我的规则</button>
        </nav>

        <div class="identity-card">
          <span>当前用户</span>
          <strong id="current-user-label">尚未选择</strong>
        </div>
      </aside>

      <main>
        <section class="view active" id="view-home">
          <header>
            <p class="eyebrow">第一步</p>
            <h2>选择当前是谁在使用</h2>
          </header>

          <div class="grid two">
            <article class="panel">
              <h3>已有用户</h3>
              <label>
                用户
                <select id="user-select"></select>
              </label>
              <button id="choose-user-btn" class="primary">使用这个身份</button>
            </article>

            <article class="panel">
              <h3>新建用户</h3>
              <label>
                用户 ID
                <input id="new-user-id" placeholder="例如：zhangsan" />
              </label>
              <label>
                显示名
                <input id="new-user-name" placeholder="例如：张三" />
              </label>
              <button id="create-user-btn">创建并使用</button>
            </article>
          </div>
        </section>

        <section class="view" id="view-record">
          <header>
            <p class="eyebrow">日常工作</p>
            <h2>上传一份湿实验记录</h2>
          </header>

          <form id="record-form" class="panel stack">
            <div class="grid two">
              <label>
                实验 ID
                <input id="experiment-id" required placeholder="例如：EXP-20260517-01" />
              </label>
              <label>
                操作者
                <input id="operator" placeholder="默认可写当前用户" />
              </label>
            </div>

            <div class="grid three">
              <label>
                课题组模板
                <select id="group-template"></select>
              </label>
              <label>
                实验模板
                <select id="experiment-template"></select>
              </label>
              <label>
                仪器模板
                <select id="instrument-template"></select>
              </label>
            </div>

            <div class="grid two">
              <label>
                实验本图片 / PDF
                <input id="images" type="file" multiple />
              </label>
              <label>
                仪器文件
                <input id="instrument-files" type="file" multiple />
              </label>
            </div>

            <button class="primary" type="submit">开始分析</button>
            <p class="muted small">
              如果暂时不选择实验模板或仪器模板，系统会先按最小默认规则处理。
            </p>
          </form>

          <section id="analysis-result" class="result-grid hidden">
            <article class="panel">
              <h3>系统识别到的内容</h3>
              <div id="recognized-summary"></div>
            </article>
            <article class="panel">
              <h3>系统按你的习惯做了哪些理解</h3>
              <div id="normalized-summary"></div>
            </article>
            <article class="panel">
              <h3>当前还缺什么</h3>
              <div id="missing-summary"></div>
            </article>
            <article class="panel">
              <h3>建议你接下来补什么</h3>
              <div id="next-step-summary"></div>
            </article>
          </section>
        </section>

        <section class="view" id="view-rules">
          <header>
            <p class="eyebrow">个人覆盖</p>
            <h2>我的规则</h2>
          </header>

          <div class="grid two align-start">
            <form id="profile-form" class="panel stack">
              <label>
                显示名
                <input id="profile-display-name" />
              </label>
              <label>
                术语别名
                <textarea id="profile-aliases" rows="4" placeholder="预烧=calcine&#10;一烧=calcine_stage_1"></textarea>
              </label>
              <label>
                样品编号模式
                <textarea id="profile-patterns" rows="3" placeholder="EXP-{date}-{seq}"></textarea>
              </label>
              <label>
                个人必填字段
                <textarea id="profile-required" rows="3" placeholder="temperature&#10;duration"></textarea>
              </label>
              <label>
                偏好字段
                <textarea id="profile-preferred" rows="3" placeholder="heating_rate&#10;atmosphere"></textarea>
              </label>
              <label>
                手写习惯备注
                <textarea id="profile-notes" rows="3"></textarea>
              </label>
              <button class="primary" type="submit">保存我的规则</button>
            </form>

            <article class="panel stack">
              <h3>当前有效配置摘要</h3>
              <div id="effective-profile-summary"></div>
              <button id="reanalyze-btn">用新规则重新分析最近记录</button>
            </article>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>
    <script src="/workbench/assets/app.js"></script>
  </body>
</html>
